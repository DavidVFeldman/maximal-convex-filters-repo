name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and audit axioms
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: |
          elan --version
          lake --version
          lean --version

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Build
        run: lake build 2>&1 | tee build.log

      - name: Audit axioms
        run: |
          set -o pipefail
          expected=$(grep -c '^#print axioms' AxiomCheck.lean)
          echo "AxiomCheck.lean requests $expected axiom reports."
          # Lean wraps long axiom lists across lines, so flatten the transcript
          # before extracting records.
          tr '\n' ' ' < build.log > flat.log
          grep -o 'depends on axioms: \[[^]]*\]' flat.log > records.txt || true
          found=$(wc -l < records.txt)
          echo "Found $found axiom reports in the build transcript."
          if [ "$found" -ne "$expected" ]; then
            echo "Expected $expected axiom reports, found $found."
            echo "Either AxiomCheck did not run, or a declaration named there was not reported."
            exit 1
          fi
          bad=$(sed 's/depends on axioms: \[//; s/\]//' records.txt \
                | tr ',' '\n' \
                | sed 's/[[:space:]]//g' \
                | grep -v '^$' \
                | grep -vE '^(propext|Classical\.choice|Quot\.sound)$' \
                | sort -u || true)
          if [ -n "$bad" ]; then
            echo "Non-standard axioms found:"
            echo "$bad"
            exit 1
          fi
          echo "Axiom audit passed: $found declarations, only propext, Classical.choice, Quot.sound."
